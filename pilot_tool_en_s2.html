,0],["m05",1],["m06",0],["m07",0],["m08",0],["m09",0],["m10",1],["m11",0],["m12",0],["m13",1],["m14",0],["m15",0],["m16",0]],[["m01",0],["m02",1],["m03",0],["m04",0],["m05",1],["m06",0],["m07",0],["m08",0],["m09",0],["m10",0],["m11",1],["m12",0],["m13",1],["m14",1],["m15",1],["m16",1]],[["m01",1],["m02",1],["m03",0],["m04",0],["m05",0],["m06",1],["m07",1],["m08",1],["m09",0],["m10",1],["m11",1],["m12",1],["m13",0],["m14",1],["m15",1],["m16",1]],[["m01",0],["m02",1],["m03",1],["m04",0],["m05",1],["m06",0],["m07",1],["m08",1],["m09",1],["m10",1],["m11",1],["m12",1],["m13",1],["m14",0],["m15",0],["m16",1]],[["m01",1],["m02",1],["m03",0],["m04",0],["m05",1],["m06",1],["m07",0],["m08",1],["m09",0],["m10",1],["m11",0],["m12",0],["m13",1],["m14",0],["m15",1],["m16",1]],[["m01",0],["m02",1],["m03",1],["m04",1],["m05",1],["m06",0],["m07",0],["m08",1],["m09",1],["m10",1],["m11",1],["m12",1],["m13",0],["m14",1],["m15",1],["m16",0]],[["m01",1],["m02",0],["m03",1],["m04",1],["m05",0],["m06",1],["m07",0],["m08",1],["m09",1],["m10",1],["m11",0],["m12",0],["m13",0],["m14",1],["m15",1],["m16",0]],[["m01",1],["m02",0],["m03",1],["m04",0],["m05",1],["m06",1],["m07",0],["m08",1],["m09",1],["m10",1],["m11",1],["m12",1],["m13",0],["m14",1],["m15",1],["m16",0]],[["m01",1],["m02",1],["m03",1],["m04",1],["m05",1],["m06",0],["m07",0],["m08",1],["m09",1],["m10",0],["m11",1],["m12",0],["m13",0],["m14",0],["m15",1],["m16",0]],[["m01",1],["m02",1],["m03",1],["m04",0],["m05",0],["m06",0],["m07",0],["m08",0],["m09",1],["m10",0],["m11",1],["m12",0],["m13",0],["m14",1],["m15",1],["m16",0]],[["m01",1],["m02",0],["m03",1],["m04",0],["m05",1],["m06",0],["m07",1],["m08",0],["m09",1],["m10",0],["m11",1],["m12",0],["m13",0],["m14",0],["m15",1],["m16",0]],[["m01",1],["m02",0],["m03",0],["m04",1],["m05",1],["m06",0],["m07",1],["m08",0],["m09",0],["m10",0],["m11",0],["m12",1],["m13",0],["m14",1],["m15",0],["m16",1]]];

  // ---------- Attention-check ("trap") items ----------
  var ATTENTION_ITEMS = [
    {id:"attn_safe", attention:true, expected:"safe",
     text:"Attention check: if you are reading this carefully, choose “Safe” and then press Continue."},
    {id:"attn_scam", attention:true, expected:"scam",

  // ---------- Helpers ----------
  function genParticipantId(){
    return "P-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
  }

  // allocation slot from the link (?slot=07); only 01..SCHEDULES.length is accepted
  function readSlot(){
    var m = /[?&]slot=(\d{1,2})(?:&|$)/.exec(window.location.search || "");
    if(!m) return null;
    var n = parseInt(m[1],10);
    return (n >= 1 && n <= SCHEDULES.length) ? n : null;
  }
  var ALLOCATION_SLOT = readSlot();
  // slot N uses schedule N; no / invalid slot -> a random schedule (logged either way)
  var SCHEDULE_ID = ALLOCATION_SLOT !== null ? ALLOCATION_SLOT : 1 + Math.floor(Math.random() * SCHEDULES.length);

  // ---------- State ----------
  var state = {
    screen:"consent",
    participantId: genParticipantId(),
    participantLabel:"",
    group:GROUP,
    demo:{age:"", gender:"", dialect:"", digitalLiteracy:null, scamFamiliarity:null, scamExposure:"", scamVictimisation:""},

  function downloadJSON(filename, dataStr){
    var blob = new Blob([dataStr], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function sendSessionData(jsonStr, participantId, group){
    var payload = {
      participant_id: participantId,
      group: group,
      allocation_slot: ALLOCATION_SLOT,
      tool_version: TOOL_VERSION,
      trials_json: JSON.stringify(JSON.parse(jsonStr)) // same data, no indentation (keepalive bodies are capped at 64 KB)
    };
    // text/plain keeps this a "simple" CORS request (Apps Script cannot answer a preflight);
    // keepalive lets the request finish even if the participant closes the page while it is in flight
    return fetch(DATA_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
      keepalive: true
    }).then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function(j){
      // the script answers {result:"success"} only after the rows are written to the sheet
      if(!j || j.result !== "success") throw new Error((j && j.message) || "not saved");
      return j;
    });
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function buildSession(){
    // the schedule fixes which variant each item shows (balanced offline); only the order is random here
    var byId = {};
    ITEMS.forEach(function(it){ byId[it.id] = it; });
    var trials = shuffle(SCHEDULES[SCHEDULE_ID-1].map(function(pair){
      return {stim: byId[pair[0]], variant: pair[1]};
    }));

    var attn = shuffle(ATTENTION_ITEMS).map(function(a){ return {stim:a, variant:null, attention:true}; });
    var positions = [];
    var guard = 0;
    while(positions.length < 2 && guard < 200){
      guard++;
      var p = 2 + Math.floor(Math.random() * (trials.length - 3));
      if(positions.indexOf(p) === -1 && (positions.length === 0 || Math.abs(positions[0]-p) >= 3)){
        positions.push(p);
      }
    }
    positions.sort(function(a,b){ return a-b; });
    trials.splice(positions[0], 0, attn[0]);
    trials.splice(positions[1] + 1, 0, attn[1]);
    return trials;
  }

    var d = state.demo;

  // after the last trial -> end-of-session questions -> debrief
  function finishTrials(){
    state.screen = "posttask"; render();
  }

  function renderTrial(){
    var trialNum = state.idx+1;
    var total = state.session.length;
    var current = state.session[state.idx];
    var stim = current.stim;
    var isAttn = !!current.attention;

    var pct = isAttn
      ? Math.round((state.idx + 0.5) / total * 100)
      : Math.round(((state.idx) + (state.stage-1)*0.5) / total * 100);

    var wrap = el('<div></div>');
    var stageLabel = isAttn ? "attention check" : ("stage " + state.stage + " of 2");
    var top = `
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
        <div class="progress-label">Message ${trialNum} of ${total} &middot; ${stageLabel}</div>
      </div>
      <div class="msg-bubble">${stim.text}</div>
    `;

    if(isAttn){
      wrap.innerHTML = top + `
        <div class="attn-banner">This is an attention-check message only, not one of the assessment messages.</div>
        <div class="card">
          <p style="font-weight:600;margin-bottom:10px;">Choose the answer requested in the message text above.</p>
          <div class="choice-row">
            <button type="button" class="choice-btn ${state.curDecision==='scam'?'selected scam':''}" data-d="scam">Scam</button>
            <button type="button" class="choice-btn ${state.curDecision==='safe'?'selected safe':''}" data-d="safe">Safe</button>
          </div>
          ${confSliderHTML("How confident are you in this decision?")}
          <button class="btn-primary" id="attnNext" ${(!state.curDecision||state.curConfidence==null)?'disabled':''}>Continue</button>
        </div>
      `;
      wrap.querySelectorAll("[data-d]").forEach(function(b){
        b.addEventListener("click", function(){ state.curDecision = b.getAttribute("data-d"); render(); });
      });
      wireConfSlider(wrap, "attnNext");
      var an = wrap.querySelector("#attnNext");
      if(an) an.addEventListener("click", function(){
        if(!state.curDecision || state.curConfidence==null) return;
        var rec = baseRecord(stim);
        rec.is_attention_check = true;
        rec.attention_check_expected = stim.expected;
        rec.attention_check_pass = (state.curDecision === stim.expected);
        rec.message_source = null;
        rec.variant_index = null;
        rec.ai_verdict = null;
        rec.initial_decision = state.curDecision;
        rec.initial_confidence = state.curConfidence;
        rec.stage1_response_ms = Date.now() - state.t1start;
        rec.final_decision = null;
        rec.final_confidence = null;
        rec.decision_time_ms = null;
        rec.switched_decision = null;
        state.records.push(rec);
        if(state.idx+1 < total){ state.idx += 1; startTrial(); }
        else { finishTrials(); }
      });
      return wrap;
    }

    if(state.stage===1){
      wrap.innerHTML = top + `
        <div class="card">
          <p style="font-weight:600;margin-bottom:10px;">In your opinion, is this message a scam or safe?</p>
          <div class="choice-row">
            <button type="button" class="choice-btn ${state.curDecision==='scam'?'selected scam':''}" data-d="scam">Scam</button>
            <button type="button" class="choice-btn ${state.curDecision==='safe'?'selected safe':''}" data-d="safe">Safe</button>
          </div>
          ${confSliderHTML("How confident are you in this decision?")}
          <button class="btn-primary" id="s1next" ${(!state.curDecision||state.curConfidence==null)?'disabled':''}>Continue</button>
        </div>
      `;
      wrap.querySelectorAll("[data-d]").forEach(function(b){
        b.addEventListener("click", function(){ state.curDecision = b.getAttribute("data-d"); render(); });
      });
      wireConfSlider(wrap, "s1next");
      var nextBtn = wrap.querySelector("#s1next");
      if(nextBtn) nextBtn.addEventListener("click", function(){
        if(!state.curDecision || state.curConfidence==null) return;
        state.t1end = Date.now();
        state.initDecision = state.curDecision;
        state.initConfidence = state.curConfidence;
        state.curDecision = null; state.curConfidence = null;
        state.stage = 2;
        state.t2reveal = Date.now();
        render();
      });
      return wrap;
    }

    var aiOut = stim.variants[current.variant];
    var showExplanation = state.group === "B";
    wrap.innerHTML = top + `
      <div class="assistant-card">
        <div class="assistant-label">AI assistant's assessment</div>
        <span class="verdict-badge ${aiOut.verdict}">${aiOut.verdict==='scam' ? 'Scam' : 'Safe'}</span>
        ${showExplanation ? `<div class="assistant-explanation">${aiOut.explanation}</div>` : ``}
      </div>
      <div class="card">
        <p style="font-weight:600;margin-bottom:10px;">After seeing the assistant's assessment, what is your final decision?</p>
        <div class="choice-row">
          <button type="button" class="choice-btn ${state.curDecision==='scam'?'selected scam':''}" data-d="scam">Scam</button>
          <button type="button" class="choice-btn ${state.curDecision==='safe'?'selected safe':''}" data-d="safe">Safe</button>
        </div>
        ${confSliderHTML("How confident are you in this final decision?")}
        <button class="btn-primary" id="s2next" ${(!state.curDecision||state.curConfidence==null)?'disabled':''}>${state.idx+1<total?'Next message':'Finish'}</button>
      </div>
    `;
    wrap.querySelectorAll("[data-d]").forEach(function(b){
      b.addEventListener("click", function(){ state.curDecision = b.getAttribute("data-d"); render(); });
    });
    wireConfSlider(wrap, "s2next");
    var endBtn = wrap.querySelector("#s2next");
    if(endBtn) endBtn.addEventListener("click", function(){
      if(!state.curDecision || state.curConfidence==null) return;
      var t3 = Date.now();
      var rec = baseRecord(stim);
      rec.is_attention_check = false;
      rec.attention_check_expected = null;
      rec.attention_check_pass = null;
      rec.message_source = stim.source;
      rec.variant_index = current.variant;
      rec.ai_verdict = aiOut.verdict;
      rec.initial_decision = state.initDecision;
      rec.initial_confidence = state.initConfidence;
      rec.stage1_response_ms = state.t1end - state.t1start;
      rec.final_decision = state.curDecision;
      rec.final_confidence = state.curConfidence;
      rec.decision_time_ms = t3 - state.t2reveal;
      rec.switched_decision = state.initDecision !== state.curDecision;
      state.records.push(rec);
      if(state.idx+1 < total){
        state.idx += 1;
        startTrial();
      } else {
        finishTrials();
      }
    });
    return wrap;
  }

  // ---------- End-of-session questions (after the last trial, before the debrief) ----------
  var SWITCH_REASONS = [
    {code:"ai_explanation",   label:"The AI assistant&rsquo;s explanation was convincing", groupBOnly:true},
    {code:"ai_more_accurate", label:"I expected the AI assistant to be more accurate than me"},
    {code:"unsure_initial",   label:"I wasn&rsquo;t sure about my first answer"},
    {code:"noticed_detail",   label:"Re-reading the message, I noticed a detail I had missed"},
    {code:"other",            label:"Other (please specify)"}
  ];
  var READ_EXPL_OPTIONS = [
    {code:"all", label:"I read all of them"},
    {code:"most", label:"I read most of them"},
    {code:"some", label:"I read some of them"},
    {code:"none", label:"I didn&rsquo;t read any of them"}
  ];

  function posttaskComplete(){
    var p = state.post;
    if(p.reliance === null) return false;
    if(state.group === "B" && !p.readExpl) return false;
    if(anySwitch()){
      if(!p.switchReason) return false;
      if(p.switchReason === "other" && !p.switchOther.trim()) return false;
    }
    return true;
  }

  function renderPosttask(){
    var wrap = el('<div></div>');
    var p = state.post;
    var showSwitch = anySwitch();
    var relBtns = [1,2,3,4,5].map(function(n){
      return `<button type="button" class="scale-btn ${p.reliance===n?'selected':''}" data-rel="${n}">${n}</button>`;
    }).join("");
    var readHTML = (state.group === "B") ? `
        <div class="field">
          <label>Did you read the explanations the AI assistant gave with its assessments?</label>
          ${READ_EXPL_OPTIONS.map(function(o){ return `
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:14.5px;margin-bottom:6px;">
            <input type="radio" name="readExpl" value="${o.code}" ${p.readExpl===o.code?'checked':''}/> ${o.label}
          </label>`; }).join("")}
        </div>` : ``;
    var reasons = SWITCH_REASONS.filter(function(r){ return !r.groupBOnly || state.group === "B"; });
    var switchHTML = showSwitch ? `
        <div class="field">
          <label>When you changed your answer after seeing the AI assistant&rsquo;s assessment, what was the main reason?</label>
          ${reasons.map(function(r){ return `
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:14.5px;margin-bottom:6px;">
            <input type="radio" name="swReason" value="${r.code}" ${p.switchReason===r.code?'checked':''}/> ${r.label}
          </label>`; }).join("")}
          ${p.switchReason==='other' ? `<input type="text" id="swOther" placeholder="Briefly describe the reason" value="${p.switchOther.replace(/"/g,'&quot;')}"/>` : ``}
        </div>` : ``;
    wrap.innerHTML = `
      <p class="eyebrow">Before you finish</p>
      <h1>A few closing questions</h1>
      <div class="card">
        <div class="field">
          <label>Overall, how much did you rely on the AI assistant&rsquo;s assessments in this session?</label>
          <div class="scale-row" id="relRow">${relBtns}</div>
          <div class="scale-caption"><span>1 &mdash; not at all</span><span>completely &mdash; 5</span></div>
        </div>
        ${readHTML}
        ${switchHTML}
      </div>
      <button class="btn-primary" id="postNext" ${posttaskComplete()?'':'disabled'}>Finish and send answers</button>
    `;
    function syncNext(){
      var nb = wrap.querySelector("#postNext");
      if(nb) nb.disabled = !posttaskComplete();
    }
    wrap.querySelectorAll("[data-rel]").forEach(function(b){
      b.addEventListener("click", function(){ state.post.reliance = parseInt(b.getAttribute("data-rel"),10); render(); });
    });
    wrap.querySelectorAll('input[name=readExpl]').forEach(function(r){
      r.addEventListener("change", function(e){ state.post.readExpl = e.target.value; syncNext(); });
    });
    wrap.querySelectorAll('input[name=swReason]').forEach(function(r){
      r.addEventListener("change", function(e){
        state.post.switchReason = e.target.value;
        if(e.target.value !== "other") state.post.switchOther = "";
        render(); // show / hide the free-text box
      });
    });
    var other = wrap.querySelector("#swOther");
    if(other) other.addEventListener("input", function(e){ state.post.switchOther = e.target.value; syncNext(); });
    wrap.querySelector("#postNext").addEventListener("click", function(){
      if(!posttaskComplete()) return;
      var sw = anySwitch();
      var post = {
        overall_ai_reliance_likert: state.post.reliance,
        read_explanations_selfreport: state.group === "B" ? state.post.readExpl : null,
        switch_reason_choice: sw ? state.post.switchReason : null,
        switch_reason_other_text: (sw && state.post.switchReason === "other") ? state.post.switchOther.trim() : null
      };
      state.postFields = post;
      state.records.forEach(function(r){ for(var k in post) r[k] = post[k]; });
      state.screen = "debrief"; render();
    });
    return wrap;
  }

  function renderDebrief(){
    var wrap = el('<div></div>');
    var attnPassed = state.records.filter(function(r){ return r.is_attention_check && r.attention_check_pass; }).length;
    var attnTotal = state.records.filter(function(r){ return r.is_attention_check; }).length;
    var json = JSON.stringify({
      participant_id: state.participantId,
      participant_label: state.participantLabel,
      group: state.group,
      demographics: {
        age_range: state.demo.age,
        gender: state.demo.gender,
        dialect_background: state.demo.dialect,
        digital_literacy: state.demo.digitalLiteracy,
        scam_familiarity: state.demo.scamFamiliarity,
        scam_exposure: state.demo.scamExposure,
        scam_victimisation: state.demo.scamVictimisation
      },
      consent_version: CONSENT_VERSION,
      consent_timestamp: state.consentTimestamp,
      tool_version: TOOL_VERSION,
      stimulus_set_version: STIMULUS_SET_VERSION,
      researcher_administered: false,
      allocation_slot: ALLOCATION_SLOT,
      allocation_list_version: ALLOCATION_LIST_VERSION,
      schedule_id: SCHEDULE_ID,
      post_task: state.postFields,
      n_trials_logged: state.records.length,
      attention_checks_passed: attnPassed,
      attention_checks_total: attnTotal,
      trials: state.records
    }, null, 2);
    wrap.innerHTML = `
      <p class="eyebrow">The experiment is over &mdash; thank you</p>
      <h1>Study debrief</h1>
      <div class="card">
        <p>Thank you for taking part. We now explain the study's full purpose: some of the AI assistant's assessments you saw were <strong>deliberately wrong</strong>, in order to measure how much people rely on AI recommendations even when they are incorrect &mdash; particularly when an explanation accompanies the assessment.</p>
        <p class="muted">Your data is stored under the participant id only, with no identifying information, and will be used in an aggregate statistical analysis within academic research. If you have any questions or wish to withdraw your data, contact the researcher at ${RESEARCHER_EMAIL}.</p>
      </div>
      <div class="card">
        <h2>Send this session's data</h2>
        <p class="status-line" id="emailStatus">Sending data... please keep this page open for a moment until the success message appears.</p>
        <button class="btn-secondary" id="retryEmail" style="display:none;">Retry sending</button>
        <hr class="sep"/>
        <p class="muted">If a message says sending failed, please download the file below and email it as an attachment to ${RESEARCHER_EMAIL} (or copy the text and send it). If sending succeeded, nothing else is needed and you can close the page.</p>
        <button class="btn-primary" id="dl">Download answers file</button>
        <p class="status-line" id="dlStatus"></p>
        <textarea class="dump" id="dump" readonly>${json}</textarea>
        <button class="btn-secondary" id="selAll" style="margin-top:10px;">Select all for manual copy</button>
      </div>
    `;

    var fname = "pilot_en_" + (state.participantId||"unknown").replace(/[^a-zA-Z0-9_\-]/g,"_") + ".json";

    function attemptEmail(){
      var status = wrap.querySelector("#emailStatus");
      var retry = wrap.querySelector("#retryEmail");
      status.textContent = "Sending data... please keep this page open for a moment until the success message appears.";
      retry.style.display = "none";
      sendSessionData(json, state.participantId, state.group).then(function(){
        status.textContent = "Data sent successfully.";
      }).catch(function(err){
        status.textContent = "Automatic sending failed (check your internet connection, then press “Retry sending”). If it keeps failing, download the file below and send it to " + RESEARCHER_EMAIL + ".";
        retry.style.display = "inline-block";
      });
    }
    attemptEmail();
    wrap.querySelector("#retryEmail").addEventListener("click", attemptEmail);

    wrap.querySelector("#dl").addEventListener("click", function(){
      var status = wrap.querySelector("#dlStatus");
      try{
        downloadJSON(fname, json);
        status.textContent = "Download started.";
      }catch(err){
        status.textContent = "Download failed — use the manual copy below.";
      }
    });
    wrap.querySelector("#selAll").addEventListener("click", function(){
      var ta = wrap.querySelector("#dump");
      ta.focus(); ta.select();
    });
    return wrap;
  }

  render();
})();
</script>
