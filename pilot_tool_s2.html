  function renderInstructions(){
    var wrap = el('<div></div>');
    wrap.innerHTML = `
      <p class="eyebrow">شرح التجربة</p>
      <h1>كيف تسير كل رسالة</h1>

          <li><strong>تقرأ الرسالة</strong> وتُبدي رأيك: هل هي "احتيال" أم "آمنة"؟ ثم تحدد مدى ثقتك بقرارك على مؤشر متصل من 0 إلى 100.</li>

  function startTrial(){
    state.stage = 1;
    state.curDecision = null;
    state.curConfidence = null;
    state.t1start = Date.now();
    state.screen = "trial";
    render();
  }

  // shared confidence-slider markup + wiring
  function confSliderHTML(promptText){
    var v = (state.curConfidence==null) ? 50 : state.curConfidence;
    var untouched = (state.curConfidence==null) ? " untouched" : "";
    var readout = (state.curConfidence==null)
      ? `<div class="conf-readout empty" id="confReadout">حرّك المؤشر لتحديد درجة ثقتك</div>`
      : `<div class="conf-readout" id="confReadout">${state.curConfidence} / 100</div>`;
    return `
      <p style="font-weight:600;margin:16px 0 4px;">${promptText}</p>
      <input type="range" min="0" max="100" step="1" value="${v}" class="conf-slider${untouched}" id="confSlider"/>
      <div class="scale-caption"><span>0 &mdash; غير واثق إطلاقاً</span><span>واثق تماماً &mdash; 100</span></div>
      ${readout}
    `;
  }
  function wireConfSlider(wrap, nextBtnId){
    var slider = wrap.querySelector("#confSlider");
    var readout = wrap.querySelector("#confReadout");
    if(!slider) return;
    slider.addEventListener("input", function(){
      state.curConfidence = parseInt(slider.value,10);
      slider.classList.remove("untouched");
      readout.classList.remove("empty");
      readout.textContent = state.curConfidence + " / 100";
      var nb = wrap.querySelector("#"+nextBtnId);
      if(nb) nb.disabled = !(state.curDecision && state.curConfidence!=null);
    });
  }

  function baseRecord(stim){
    return {
      participant_id: state.participantId,
      participant_label: state.participantLabel,
      group: state.group,
      age_range: state.demo.age,
      gender: state.demo.gender,
      dialect_background: state.demo.dialect,
      digital_literacy: state.demo.digitalLiteracy,
      scam_familiarity: state.demo.scamFamiliarity,
      scam_exposure: state.demo.scamExposure,
      scam_victimisation: state.demo.scamVictimisation,
      order_position: state.idx+1,
      item_id: stim.id,
      consent_version: CONSENT_VERSION,
      consent_timestamp: state.consentTimestamp,
      tool_version: TOOL_VERSION,
      stimulus_set_version: STIMULUS_SET_VERSION,
      researcher_administered: false,
      allocation_slot: ALLOCATION_SLOT,
      allocation_list_version: ALLOCATION_LIST_VERSION,
      schedule_id: SCHEDULE_ID
    };
  }

  // real (non-attention) trials on which the final decision differed from the first one
  function anySwitch(){
    return state.records.some(function(r){ return !r.is_attention_check && r.switched_decision === true; });
  }

  // after the last trial -> end-of-session questions -> debrief
  function finishTrials(){
    state.screen = "posttask"; render();
  }

  function renderTrial(){
    var trialNum = state.idx+1;
    var total = state.session.length;
    var current = state.session[state.idx];
    var stim = current.stim;
    var isAttn = !!current.attention;

    var pct = isAttn
      ? Math.round((state.idx + 0.5) / total * 100)
      : Math.round(((state.idx) + (state.stage-1)*0.5) / total * 100);

    var wrap = el('<div></div>');
    var stageLabel = isAttn ? "رسالة تحقّق" : ("مرحلة " + state.stage + " من 2");
    var top = `
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
        <div class="progress-label">رسالة ${trialNum} من ${total} &middot; ${stageLabel}</div>
      </div>
      <div class="msg-bubble">${stim.text}</div>
    `;

    // ----- Attention-check trial: single stage, no AI reveal -----
    if(isAttn){
      wrap.innerHTML = top + `
        <div class="attn-banner">هذه رسالة للتحقق من الانتباه فقط، وليست جزءاً من رسائل التقييم.</div>
        <div class="card">
          <p style="font-weight:600;margin-bottom:10px;">اختر الإجابة المطلوبة في نص الرسالة أعلاه.</p>
          <div class="choice-row">
            <button type="button" class="choice-btn ${state.curDecision==='scam'?'selected scam':''}" data-d="scam">احتيال</button>
            <button type="button" class="choice-btn ${state.curDecision==='safe'?'selected safe':''}" data-d="safe">آمنة</button>
          </div>
          ${confSliderHTML("ما مدى ثقتك بهذا القرار؟")}
          <button class="btn-primary" id="attnNext" ${(!state.curDecision||state.curConfidence==null)?'disabled':''}>متابعة</button>
        </div>
      `;
      wrap.querySelectorAll("[data-d]").forEach(function(b){
        b.addEventListener("click", function(){ state.curDecision = b.getAttribute("data-d"); render(); });
      });
      wireConfSlider(wrap, "attnNext");
      var an = wrap.querySelector("#attnNext");
      if(an) an.addEventListener("click", function(){
        if(!state.curDecision || state.curConfidence==null) return;
        var rec = baseRecord(stim);
        rec.is_attention_check = true;
        rec.attention_check_expected = stim.expected;
        rec.attention_check_pass = (state.curDecision === stim.expected);
        rec.message_source = null;
        rec.variant_index = null;
        rec.ai_verdict = null;
        rec.initial_decision = state.curDecision;
        rec.initial_confidence = state.curConfidence;
        rec.stage1_response_ms = Date.now() - state.t1start;
        rec.final_decision = null;
        rec.final_confidence = null;
        rec.decision_time_ms = null;
        rec.switched_decision = null;
        state.records.push(rec);
        if(state.idx+1 < total){ state.idx += 1; startTrial(); }
        else { finishTrials(); }
      });
      return wrap;
    }

    // ----- Stage 1: independent judgement -----
    if(state.stage===1){
      wrap.innerHTML = top + `
        <div class="card">
          <p style="font-weight:600;margin-bottom:10px;">برأيك، هل هذه الرسالة احتيال أم آمنة؟</p>
          <div class="choice-row">
            <button type="button" class="choice-btn ${state.curDecision==='scam'?'selected scam':''}" data-d="scam">احتيال</button>
            <button type="button" class="choice-btn ${state.curDecision==='safe'?'selected safe':''}" data-d="safe">آمنة</button>
          </div>
          ${confSliderHTML("ما مدى ثقتك بهذا القرار؟")}
          <button class="btn-primary" id="s1next" ${(!state.curDecision||state.curConfidence==null)?'disabled':''}>متابعة</button>
        </div>
      `;
      wrap.querySelectorAll("[data-d]").forEach(function(b){
        b.addEventListener("click", function(){ state.curDecision = b.getAttribute("data-d"); render(); });
      });
      wireConfSlider(wrap, "s1next");
      var nextBtn = wrap.querySelector("#s1next");
      if(nextBtn) nextBtn.addEventListener("click", function(){
        if(!state.curDecision || state.curConfidence==null) return;
        state.t1end = Date.now();
        state.initDecision = state.curDecision;
        state.initConfidence = state.curConfidence;
        state.curDecision = null; state.curConfidence = null;
        state.stage = 2;
        state.t2reveal = Date.now();
        render();
      });
      return wrap;
    }

    // ----- Stage 2: final decision after AI reveal -----
    var aiOut = stim.variants[current.variant];
    var showExplanation = state.group === "B";
    wrap.innerHTML = top + `
      <div class="assistant-card">
        <div class="assistant-label">تقييم المساعد الذكي</div>
        <span class="verdict-badge ${aiOut.verdict}">${aiOut.verdict==='scam' ? 'احتيال' : 'آمنة'}</span>
        ${showExplanation ? `<div class="assistant-explanation">${aiOut.explanation}</div>` : ``}
      </div>
      <div class="card">
        <p style="font-weight:600;margin-bottom:10px;">بعد رؤية تقييم المساعد، ما قرارك النهائي؟</p>
        <div class="choice-row">
          <button type="button" class="choice-btn ${state.curDecision==='scam'?'selected scam':''}" data-d="scam">احتيال</button>
          <button type="button" class="choice-btn ${state.curDecision==='safe'?'selected safe':''}" data-d="safe">آمنة</button>
        </div>
        ${confSliderHTML("ما مدى ثقتك بهذا القرار النهائي؟")}
        <button class="btn-primary" id="s2next" ${(!state.curDecision||state.curConfidence==null)?'disabled':''}>${state.idx+1<total?'الرسالة التالية':'إنهاء'}</button>
      </div>
    `;
    wrap.querySelectorAll("[data-d]").forEach(function(b){
      b.addEventListener("click", function(){ state.curDecision = b.getAttribute("data-d"); render(); });
    });
    wireConfSlider(wrap, "s2next");
    var endBtn = wrap.querySelector("#s2next");
    if(endBtn) endBtn.addEventListener("click", function(){
      if(!state.curDecision || state.curConfidence==null) return;
      var t3 = Date.now();
      var rec = baseRecord(stim);
      rec.is_attention_check = false;
      rec.attention_check_expected = null;
      rec.attention_check_pass = null;
      rec.message_source = stim.source;
      rec.variant_index = current.variant;
      rec.ai_verdict = aiOut.verdict;
      rec.initial_decision = state.initDecision;
      rec.initial_confidence = state.initConfidence;
      rec.stage1_response_ms = state.t1end - state.t1start;
      rec.final_decision = state.curDecision;
      rec.final_confidence = state.curConfidence;
      rec.decision_time_ms = t3 - state.t2reveal;
      rec.switched_decision = state.initDecision !== state.curDecision;
      state.records.push(rec);
      if(state.idx+1 < total){
        state.idx += 1;
        startTrial();
      } else {
        finishTrials();
      }
    });
    return wrap;
  }

  // ---------- End-of-session questions (after the last trial, before the debrief) ----------
  var SWITCH_REASONS = [
    {code:"ai_explanation",   label:"تفسير المساعد الذكي كان مقنعاً", groupBOnly:true},
    {code:"ai_more_accurate", label:"توقّعت أن المساعد الذكي أدقّ منّي"},
    {code:"unsure_initial",   label:"لم أكن متأكداً من إجابتي الأولى"},
    {code:"noticed_detail",   label:"عند إعادة قراءة الرسالة انتبهت لتفصيل فاتني"},
    {code:"other",            label:"أخرى (يُرجى التوضيح)"}
  ];
  var READ_EXPL_OPTIONS = [
    {code:"all", label:"قرأتها كلها"},
    {code:"most", label:"قرأت معظمها"},
    {code:"some", label:"قرأت بعضها"},
    {code:"none", label:"لم أقرأ أياً منها"}
  ];

  function posttaskComplete(){
    var p = state.post;
    if(p.reliance === null) return false;
    if(state.group === "B" && !p.readExpl) return false;
    if(anySwitch()){
      if(!p.switchReason) return false;
      if(p.switchReason === "other" && !p.switchOther.trim()) return false;
    }
    return true;
  }

  function renderPosttask(){
    var wrap = el('<div></div>');
    var p = state.post;
    var showSwitch = anySwitch();
    var relBtns = [1,2,3,4,5].map(function(n){
      return `<button type="button" class="scale-btn ${p.reliance===n?'selected':''}" data-rel="${n}">${n}</button>`;
    }).join("");
    var readHTML = (state.group === "B") ? `
        <div class="field">
          <label>هل قرأت التفسيرات التي قدّمها المساعد الذكي مع تقييماته؟</label>
          ${READ_EXPL_OPTIONS.map(function(o){ return `
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:14.5px;margin-bottom:6px;">
            <input type="radio" name="readExpl" value="${o.code}" ${p.readExpl===o.code?'checked':''}/> ${o.label}
          </label>`; }).join("")}
        </div>` : ``;
    var reasons = SWITCH_REASONS.filter(function(r){ return !r.groupBOnly || state.group === "B"; });
    var switchHTML = showSwitch ? `
        <div class="field">
          <label>عندما غيّرت إجابتك بعد رؤية تقييم المساعد الذكي، ما السبب الرئيسي؟</label>
          ${reasons.map(function(r){ return `
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:14.5px;margin-bottom:6px;">
            <input type="radio" name="swReason" value="${r.code}" ${p.switchReason===r.code?'checked':''}/> ${r.label}
          </label>`; }).join("")}
          ${p.switchReason==='other' ? `<input type="text" id="swOther" placeholder="اكتب السبب باختصار" value="${p.switchOther.replace(/"/g,'&quot;')}"/>` : ``}
        </div>` : ``;
    wrap.innerHTML = `
      <p class="eyebrow">قبل الإنهاء</p>
      <h1>أسئلة ختامية قصيرة</h1>
      <div class="card">
        <div class="field">
          <label>بشكل عام، لأي مدى اعتمدت على تقييمات المساعد الذكي في هذه الجلسة؟</label>
          <div class="scale-row" id="relRow">${relBtns}</div>
          <div class="scale-caption"><span>1 &mdash; لم أعتمد عليه إطلاقاً</span><span>اعتمدت عليه بشكل كامل &mdash; 5</span></div>
        </div>
        ${readHTML}
        ${switchHTML}
      </div>
      <button class="btn-primary" id="postNext" ${posttaskComplete()?'':'disabled'}>إنهاء وإرسال الإجابات</button>
    `;
    function syncNext(){
      var nb = wrap.querySelector("#postNext");
      if(nb) nb.disabled = !posttaskComplete();
    }
    wrap.querySelectorAll("[data-rel]").forEach(function(b){
      b.addEventListener("click", function(){ state.post.reliance = parseInt(b.getAttribute("data-rel"),10); render(); });
    });
    wrap.querySelectorAll('input[name=readExpl]').forEach(function(r){
      r.addEventListener("change", function(e){ state.post.readExpl = e.target.value; syncNext(); });
    });
    wrap.querySelectorAll('input[name=swReason]').forEach(function(r){
      r.addEventListener("change", function(e){
        state.post.switchReason = e.target.value;
        if(e.target.value !== "other") state.post.switchOther = "";
        render(); // show / hide the free-text box
      });
    });
    var other = wrap.querySelector("#swOther");
    if(other) other.addEventListener("input", function(e){ state.post.switchOther = e.target.value; syncNext(); });
    wrap.querySelector("#postNext").addEventListener("click", function(){
      if(!posttaskComplete()) return;
      var sw = anySwitch();
      var post = {
        overall_ai_reliance_likert: state.post.reliance,
        read_explanations_selfreport: state.group === "B" ? state.post.readExpl : null,
        switch_reason_choice: sw ? state.post.switchReason : null,
        switch_reason_other_text: (sw && state.post.switchReason === "other") ? state.post.switchOther.trim() : null
      };
      state.postFields = post;
      state.records.forEach(function(r){ for(var k in post) r[k] = post[k]; });
      state.screen = "debrief"; render();
    });
    return wrap;
  }

  function renderDebrief(){
    var wrap = el('<div></div>');
    var attnPassed = state.records.filter(function(r){ return r.is_attention_check && r.attention_check_pass; }).length;
    var attnTotal = state.records.filter(function(r){ return r.is_attention_check; }).length;
    var json = JSON.stringify({
      participant_id: state.participantId,
      participant_label: state.participantLabel,
      group: state.group,
      demographics: {
        age_range: state.demo.age,
        gender: state.demo.gender,
        dialect_background: state.demo.dialect,
        digital_literacy: state.demo.digitalLiteracy,
        scam_familiarity: state.demo.scamFamiliarity,
        scam_exposure: state.demo.scamExposure,
        scam_victimisation: state.demo.scamVictimisation
      },
      consent_version: CONSENT_VERSION,
      consent_timestamp: state.consentTimestamp,
      tool_version: TOOL_VERSION,
      stimulus_set_version: STIMULUS_SET_VERSION,
      researcher_administered: false,
      allocation_slot: ALLOCATION_SLOT,
      allocation_list_version: ALLOCATION_LIST_VERSION,
      schedule_id: SCHEDULE_ID,
      post_task: state.postFields,
      n_trials_logged: state.records.length,
      attention_checks_passed: attnPassed,
      attention_checks_total: attnTotal,
      trials: state.records
    }, null, 2);
    wrap.innerHTML = `
      <p class="eyebrow">انتهت التجربة &mdash; شكراً لك</p>
      <h1>توضيح الغرض من الدراسة</h1>
      <div class="card">
        <p>شكراً لمشاركتك. نوضح الآن هدف الدراسة بالكامل: بعض تقييمات المساعد الذكي التي شاهدتها كانت <strong>خاطئة عمداً</strong>، بهدف قياس مدى اعتماد الأشخاص على توصيات الذكاء الاصطناعي حتى عندما تكون غير صحيحة، خصوصاً عند وجود تفسير مصاحب للتقييم.</p>
        <p class="muted">بياناتك محفوظة برمز المشارك فقط دون أي معلومة تعرّف هويتك، وستُستخدم في تحليل إحصائي مجمّع ضمن بحث أكاديمي. إن كانت لديك أي أسئلة أو رغبت بسحب بياناتك، تواصل مع الباحثة عبر ${RESEARCHER_EMAIL}.</p>
      </div>
      <div class="card">
        <h2>إرسال بيانات هذه الجلسة</h2>
        <p class="status-line" id="emailStatus">جاري إرسال البيانات... يُرجى إبقاء الصفحة مفتوحة لحظات حتى تظهر رسالة النجاح.</p>
        <button class="btn-secondary" id="retryEmail" style="display:none;">إعادة محاولة الإرسال</button>
        <hr class="sep"/>
        <p class="muted">إذا ظهرت رسالة تفيد بتعذّر الإرسال، يُرجى تنزيل الملف أدناه وإرساله كمرفق إلى ${RESEARCHER_EMAIL} (أو نسخ النص وإرساله). إذا تم الإرسال بنجاح فلا حاجة لأي خطوة إضافية، ويمكنك إغلاق الصفحة.</p>
        <button class="btn-primary" id="dl">تنزيل ملف الإجابات</button>
        <p class="status-line" id="dlStatus"></p>
        <textarea class="dump" id="dump" readonly>${json}</textarea>
        <button class="btn-secondary" id="selAll" style="margin-top:10px;">تحديد الكل للنسخ اليدوي</button>
      </div>
    `;

    var fname = "pilot_" + (state.participantId||"unknown").replace(/[^a-zA-Z0-9_\-]/g,"_") + ".json";

    function attemptEmail(){
      var status = wrap.querySelector("#emailStatus");
      var retry = wrap.querySelector("#retryEmail");
      status.textContent = "جاري إرسال البيانات... يُرجى إبقاء الصفحة مفتوحة لحظات حتى تظهر رسالة النجاح.";
      retry.style.display = "none";
      sendSessionData(json, state.participantId, state.group).then(function(){
        status.textContent = "تم إرسال البيانات بنجاح.";
      }).catch(function(err){
        status.textContent = "تعذّر الإرسال التلقائي (تحقق من الاتصال بالإنترنت ثم اضغط «إعادة محاولة الإرسال»). إذا استمر الخطأ، نزّل الملف أدناه وأرسله إلى " + RESEARCHER_EMAIL + ".";
        retry.style.display = "inline-block";
      });
    }
    attemptEmail();
    wrap.querySelector("#retryEmail").addEventListener("click", attemptEmail);

    wrap.querySelector("#dl").addEventListener("click", function(){
      var status = wrap.querySelector("#dlStatus");
      try{
        downloadJSON(fname, json);
        status.textContent = "تم بدء التنزيل.";
      }catch(err){
        status.textContent = "تعذّر التنزيل — استخدم النسخ اليدوي أدناه.";
      }
    });
    wrap.querySelector("#selAll").addEventListener("click", function(){
      var ta = wrap.querySelector("#dump");
      ta.focus(); ta.select();
    });
    return wrap;
  }

  render();
})();
</script>
